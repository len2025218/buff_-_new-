%YAML:1.0
debug: 1 
xyz_offset: #相机坐标系补偿
  x: -0.15
  y: 0.1
  z: 0
angle_offset: #角度补偿
  pitch: 1.5
  yaw: 2.3

tracker: #大符跟踪器
  max_delta_t: 0.7
  buff_max_v: 4.0

predictor: #解算参数的预测器参数
  delay_big: -0.01
  delay_small: 0.32
    #               a    w   p    b
  params_bound: [ 0.5, 0.4,-3.14, 0.5, 
                  3.0, 2.0, 3.14, 4.0 ] #参数上下限

































